<div id="tab-content-setup">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-8">
        <div>
            <div class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 mb-8">
                <h2 class="text-xl font-semibold mb-4 dark:text-white">Player Roster</h2>
                <div id="player-roster-list" class="space-y-3 mb-4"></div>
                <div id="add-player-form" class="space-y-2">
                    <input type="text" id="new-player-name-input" placeholder="Enter new player name" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-emerald-500 focus:border-emerald-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                    <button id="add-player-btn" class="w-full bg-gray-800 dark:bg-gray-600 text-white py-2 px-4 rounded-xl hover:bg-gray-700 dark:hover:bg-gray-500 transition-colors duration-200">Add Player</button>
                </div>
            </div>
            
            <div class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                <h2 class="text-xl font-semibold mb-4 dark:text-white">Season Management</h2>
                <div id="seasons-list" class="space-y-3 mb-4"></div>
                <div id="add-season-form" class="space-y-2">
                    <input type="text" id="new-season-name-input" placeholder="e.g., Summer 25" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-emerald-500 focus:border-emerald-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                    <button id="add-season-btn" class="w-full bg-gray-800 dark:bg-gray-600 text-white py-2 px-4 rounded-xl hover:bg-gray-700 dark:hover:bg-gray-500 transition-colors duration-200">Add New Season</button>
                </div>
            </div>
        </div>

        <div class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
            <h2 class="text-xl font-semibold mb-4 dark:text-white">Setup New Match</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Season</label>
                <p id="active-season-display" class="mt-1 text-lg font-semibold text-emerald-600 dark:text-emerald-400"></p>
            </div>
            <div class="mb-4">
                <label for="opposition-name-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Opposition Name</label>
                <input type="text" id="opposition-name-input" placeholder="e.g., The King's Arms" class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-emerald-500 focus:border-emerald-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
            </div>
            <div class="mb-4">
                <label for="match-date-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Match Date (optional)</label>
                <input type="date" id="match-date-input" class="mt-1 w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-emerald-500 focus:border-emerald-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Leave blank to use today's date.</p>
            </div>
            <div id="fixture-setup-form" class="space-y-4"></div>
            <div class="mt-6">
                <button id="create-fixture-btn" class="w-full bg-emerald-600 text-white py-3 px-4 rounded-xl hover:bg-emerald-700 transition-colors duration-200 font-semibold text-lg">Create & Start Fixture</button>
            </div>
        </div>
    </div>
</div>
